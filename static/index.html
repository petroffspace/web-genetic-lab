<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genetic Image Evolution Lab</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="header">
        <h1>Genetic Image Evolution Lab</h1>
        <button id="generate-btn" class="btn-primary">Generate All</button>
    </div>
    <div class="footer-info">
        Click image: evolve · 🔒/🔓: Lock · 📤: Upload & reverse engineer · 📂: Load params · 🧬: Save params · 🖼️: Save image · ↩️: Undo
    </div>
        <div class="feature-panel">
            <strong>Renderer features</strong> <span class="feature-note">(apply to newly generated images only)</span>
            <label><input type="checkbox" id="feat-transform" checked> Transforms</label>
            <label><input type="checkbox" id="feat-relief" checked> Relief lighting</label>
            <label><input type="checkbox" id="feat-spikes" checked> Spectral spikes</label>
            <label><input type="checkbox" id="feat-chroma" checked> Chroma modulation</label>
            <label><input type="checkbox" id="feat-cone" checked> Directional streaks</label>
            <label><input type="checkbox" id="feat-domain_warp" checked> Domain warp (marble)</label>
            <label><input type="checkbox" id="feat-symmetry" checked> Radial symmetry</label>
            <label><input type="checkbox" id="feat-anchor_palette" checked> Anchor palettes</label>
        </div>

        <div id="grid" class="grid"></div>

    <!-- Animation Studio Section -->
    <div class="animation-studio">
        <h2>🎬 Animation Studio</h2>
        <p class="studio-note">Render frame sequences for post-production editing</p>
        
        <div class="form-row">
            <label>Source A (Start):</label>
            <select id="source-a-cell"><option value="0">Cell 0</option><option value="1">Cell 1</option><option value="2">Cell 2</option><option value="3">Cell 3</option><option value="4">Cell 4</option><option value="5">Cell 5</option><option value="6">Cell 6</option><option value="7">Cell 7</option><option value="8">Cell 8</option></select>
        </div>
        <div class="form-row">
            <label>Source B (End):</label>
            <select id="source-b-cell"><option value="0">Cell 0</option><option value="1">Cell 1</option><option value="2">Cell 2</option><option value="3">Cell 3</option><option value="4">Cell 4</option><option value="5">Cell 5</option><option value="6">Cell 6</option><option value="7">Cell 7</option><option value="8">Cell 8</option></select>
        </div>
        <div class="form-row">
            <label>Total Frames:</label>
            <input type="number" id="anim-frames" value="300" min="10" max="10000">
        </div>
        <div class="form-row">
            <label>FPS (for reference):</label>
            <input type="number" id="anim-fps" value="15" min="1" max="60">
        </div>
        <div class="form-row">
            <label>Resolution (WxH):</label>
            <input type="text" id="anim-resolution" value="1920x1080" placeholder="1920x1080">
        </div>
        <div class="form-row">
            <label>Morph Mode:</label>
            <select id="anim-mode">
                <option value="crossfade" selected>Crossfade (smooth image blend)</option>
                <option value="params">Parameter Morph (subtle texture shift)</option>
            </select>
        </div>
        <div class="form-row">
            <label>Easing Method:</label>
            <select id="anim-easing">
                <optgroup label="Basic">
                    <option value="linear">Linear (constant speed)</option>
                    <option value="sine">Sine (smooth in/out)</option>
                </optgroup>
                <optgroup label="Quadratic">
                    <option value="inquad">In Quad (slow start)</option>
                    <option value="outquad">Out Quad (slow end)</option>
                    <option value="inoutquad">In-Out Quad</option>
                </optgroup>
                <optgroup label="Cubic">
                    <option value="incubic">In Cubic</option>
                    <option value="outcubic">Out Cubic</option>
                    <option value="inoutcubic" selected>In-Out Cubic</option>
                </optgroup>
                <optgroup label="Quartic">
                    <option value="inquart">In Quart</option>
                    <option value="outquart">Out Quart</option>
                    <option value="inoutquart">In-Out Quart</option>
                </optgroup>
                <optgroup label="Quintic">
                    <option value="inquint">In Quint</option>
                    <option value="outquint">Out Quint</option>
                    <option value="inoutquint">In-Out Quint</option>
                </optgroup>
                <optgroup label="Special">
                    <option value="expo">Expo (extreme)</option>
                    <option value="circle">Circle (round)</option>
                    <option value="back">Back (overshoot)</option>
                    <option value="elastic">Elastic (spring)</option>
                    <option value="bounce">Bounce (drop)</option>
                    <option value="gauss">Gauss (bell curve)</option>
                </optgroup>
            </select>
        </div>
        <div class="form-row">
            <label>Output Directory:</label>
            <input type="text" id="anim-dir" value="" placeholder="Current working dir">
        </div>
        
        <button id="render-btn" class="btn-primary btn-large">Render PNG Sequence</button>
        
        <div id="render-progress" class="progress-container hidden">
            <span id="render-status">Starting...</span>
            <progress id="render-bar" value="0" max="100"></progress>
            <span id="render-info"></span>
        </div>
        
        <div id="render-result" class="result-message hidden"></div>
    </div>

    <script src="/static/app.js"></script>

</body>
</html>
